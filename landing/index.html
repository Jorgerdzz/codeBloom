<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Eternum</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Clásicos que perduran, estrenos que sorprenden</h1>

        <section id="carrusel">
            <button class="anterior">&#10094;</button>
            <div class="imagenes">
                <img src="images/carrusel1.webp" alt="" class="activo">
                <img src="images/carrusel2.webp" alt="">
                <img src="images/carrusel3.webp" alt="">
                <img src="images/carrusel4.webp" alt="">
            </div>
            <button class="siguiente">&#10095;</button>
            <div class="puntos">
                <span class="punto activo"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
            </div>
        </section>

        <form action="" id="compra_rapida">
            <select name="pelicula" id="pelicula">
                <option value="" disabled selected>Película</option>
                <option value="">Película1</option>
                <option value="">Película2</option>
                <option value="">Película3</option>
                <option value="">Película4</option>
                <option value="">Película5</option>
                <option value="">Película6</option>
                <option value="">Película7</option>
                <option value="">Película8</option>
                <option value="">Película9</option>
                <option value="">Película10</option>
            </select>
            <select name="fecha" id="fecha">
                <option value="" disabled selected>Día</option>
                <option value="">01/01/2025</option>
                <option value="">02/01/2025</option>
                <option value="">03/01/2025</option>
                <option value="">04/01/2025</option>
                <option value="">05/01/2025</option>
            </select>
            <select name="sesion" id="sesion">
                <option value="" disabled selected>Sesión</option>
                <option value="">16:30</option>
                <option value="">19:00</option>
                <option value="">21:30</option>
                <option value="">00:30</option>
            </select>
            <button type="submit">Comprar</button>
        </form>

        <h2>CARTELERA</h2>

        <section id="cartelera">
            <div class="cartel">
                <a href="#"><img src="images/cartel1.webp" alt=""></a>
            </div>
            <div class="cartel">
                <a href="#"><img src="images/cartel2.webp" alt=""></a>
            </div>
            <div class="cartel">
                <a href="#"><img src="images/cartel3.webp" alt=""></a>
            </div>
            <div class="cartel">
                <a href="#"><img src="images/cartel4.webp" alt=""></a>
            </div>
            <div class="cartel">
                <a href="#"><img src="images/cartel5.webp" alt=""></a>
            </div>
            <div class="cartel">
                <a href="#"><img src="images/cartel6.webp" alt=""></a>
            </div>
            <div class="cartel">
                <a href="#"><img src="images/cartel7.webp" alt=""></a>
            </div>
            <div class="cartel">
                <a href="#"><img src="images/cartel8.webp" alt=""></a>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
